<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Badsbrotel Suites — Hotel Ticket Desk</title>
<style>
  :root{
    --navy:#152238;
    --navy-2:#1c2e4a;
    --cream:#FAF7F1;
    --card:#FFFFFF;
    --ink:#26241f;
    --ink-soft:#6b6558;
    --line:#e7e1d4;
    --brass:#a9793f;
    --brass-dark:#8a6230;
    --brass-tint:#f3e6d2;
    --blue:#3968b0;
    --blue-tint:#e6edf8;
    --amber:#b0813f;
    --amber-tint:#f5ead4;
    --green:#3f7d55;
    --green-tint:#e4f0e6;
    --red:#a5372b;
    --red-tint:#f6e3e0;
    --gray:#7a7566;
    --gray-tint:#eeece5;
    --radius:10px;
    --shadow: 0 1px 2px rgba(21,34,56,.06), 0 6px 20px rgba(21,34,56,.06);
    font-size:16px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--cream);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{
    font-family:Georgia,"Times New Roman",Times,serif;
    letter-spacing:.2px;
  }
  button{font-family:inherit;}
  ::selection{background:var(--brass-tint);}

  /* ---------- Top bar ---------- */
  .topbar{
    background:#0C421B;
    color:#f4efe4;
    padding:16px 22px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    position:sticky;
    top:0;
    z-index:40;
    box-shadow:0 2px 12px rgba(0,0,0,.18);
    flex-wrap:wrap;
  }
  .brand{display:flex;align-items:center;gap:12px;}
  .brand-mark{
    width:38px;height:38px;border-radius:8px;
    background:#0C421B;
    display:flex;align-items:center;justify-content:center;
    font-family:Georgia,serif;font-weight:700;color:var(--white);
    font-size:18px;
    box-shadow:inset 0 0 0 2px rgba(255,255,255,.25);
    flex-shrink:0;
  }
  .brand-text h1{font-size:19px;margin:0;line-height:1.1;color:#fbf6ea;}
  .brand-text span{font-size:11.5px;color:#c8b998;letter-spacing:1.5px;text-transform:uppercase;}

  .pill-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .status-pill{
    display:flex;align-items:center;gap:7px;
    font-size:12px;
    padding:6px 12px;
    border-radius:100px;
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.14);
    color:#e9e1cf;
    white-space:nowrap;
    cursor:default;
  }
  .status-dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px rgba(63,125,85,.25);flex-shrink:0;}
  .status-dot.off{background:#c98b3f;box-shadow:0 0 0 3px rgba(201,139,63,.25);}
  .status-dot.gray{background:#8a8578;box-shadow:0 0 0 3px rgba(138,133,120,.25);}
  .status-dot.err{background:#a5372b;box-shadow:0 0 0 3px rgba(165,55,43,.25);}

  .topbar-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .icon-btn{
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.16);
    color:#f4efe4;
    padding:8px 13px;
    border-radius:8px;
    cursor:pointer;
    font-size:13px;
    display:flex;align-items:center;gap:6px;
    transition:background .15s ease;
  }
  .icon-btn:hover{background:rgba(255,255,255,.16);}

  /* ---------- Layout ---------- */
  .wrap{max-width:1320px;margin:0 auto;padding:22px 22px 60px;}

  .stats{
    display:grid;
    grid-template-columns:repeat(6,1fr);
    gap:12px;
    margin-bottom:20px;
  }
  .stat-card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:14px 16px;
    box-shadow:var(--shadow);
    position:relative;
    overflow:hidden;
  }
  .stat-card::before{
    content:"";position:absolute;left:0;top:0;bottom:0;width:4px;
    background:var(--accent,var(--brass));
  }
  .stat-num{font-family:Georgia,serif;font-size:24px;font-weight:700;color:var(--ink);line-height:1;}
  .stat-label{font-size:10.5px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.8px;margin-top:6px;}

  .toolbar{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    align-items:center;
    justify-content:space-between;
    margin-bottom:16px;
  }
  .filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;}
  .search-box{
    display:flex;align-items:center;gap:8px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:8px;
    padding:8px 12px;
    min-width:220px;
  }
  .search-box input{
    border:none;outline:none;background:transparent;font-size:13.5px;width:100%;color:var(--ink);
  }
  select, .btn{
    font-size:13px;
    padding:8px 12px;
    border-radius:8px;
    border:1px solid var(--line);
    background:var(--card);
    color:var(--ink);
    cursor:pointer;
  }
  select:focus, input:focus, textarea:focus, button:focus-visible{
    outline:2px solid var(--brass);
    outline-offset:1px;
  }
  .btn-primary{
    background:var(--navy);
    color:#f6f1e6;
    border-color:var(--navy);
    font-weight:600;
    display:flex;align-items:center;gap:7px;
  }
  .btn-primary:hover{background:var(--navy-2);}
  .btn-ghost{background:transparent;}
  .btn-ghost:hover{background:var(--gray-tint);}
  .view-toggle{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;}
  .view-toggle button{
    border:none;background:var(--card);padding:8px 12px;font-size:13px;cursor:pointer;color:var(--ink-soft);
  }
  .view-toggle button.active{background:var(--navy);color:#fff;}

  /* ---------- Board (kanban) ---------- */
  .board{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;align-items:start;}
  .col{background:#f2ede2;border-radius:12px;padding:10px;min-height:120px;}
  .col-head{
    display:flex;align-items:center;justify-content:space-between;
    padding:6px 8px 10px;
  }
  .col-head h3{font-size:13.5px;margin:0;text-transform:uppercase;letter-spacing:.8px;color:var(--ink-soft);font-family:inherit;}
  .col-count{
    background:var(--card);border:1px solid var(--line);border-radius:100px;
    font-size:11.5px;padding:1px 8px;color:var(--ink-soft);
  }
  .col-body{display:flex;flex-direction:column;gap:9px;min-height:40px;}
  .empty-col{
    font-size:12px;color:var(--ink-soft);text-align:center;padding:18px 6px;border:1.5px dashed var(--line);border-radius:8px;
  }

  /* ---------- Ticket card (keycard styling) ---------- */
  .ticket{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:9px;
    padding:12px 13px 11px;
    cursor:pointer;
    box-shadow:var(--shadow);
    position:relative;
    transition:transform .12s ease, box-shadow .12s ease;
    border-top:3px solid var(--accent, var(--brass));
  }
  .ticket.overdue{box-shadow:0 0 0 1px rgba(165,55,43,.35), var(--shadow);}
  .ticket:hover{transform:translateY(-2px);box-shadow:0 4px 16px rgba(21,34,56,.14);}
  .ticket-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:6px;}
  .ticket-id{font-size:10.5px;color:var(--ink-soft);letter-spacing:.5px;font-variant-numeric:tabular-nums;}
  .prio-tag{
    font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;padding:3px 8px;border-radius:4px;white-space:nowrap;flex-shrink:0;
  }
  .prio-tag.high{background:var(--red-tint);color:var(--red);}
  .prio-tag.medium{background:var(--amber-tint);color:var(--amber);}
  .prio-tag.low{background:var(--green-tint);color:var(--green);}
  .ticket-title{font-size:13.5px;font-weight:600;color:var(--ink);margin:0 0 8px;line-height:1.35;}
  .ticket-body{font-size:12px;color:var(--ink-soft);line-height:1.35;margin-bottom:8px;}
  .ticket-footer{
    display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--ink-soft);border-top:1px solid var(--line);padding-top:8px;
  }
  .ticket-dept{font-weight:600;}
  .ticket-due{font-variant-numeric:tabular-nums;}
  .ticket-due.soon{color:var(--amber);}
  .ticket-due.overdue{color:var(--red);font-weight:600;}

  /* ---------- Table view ---------- */
  table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);}
  thead{background:#f2ede2;}
  th{
    padding:10px 12px;text-align:left;font-size:11.5px;font-weight:600;
    color:var(--ink-soft);text-transform:uppercase;letter-spacing:.6px;border-bottom:1px solid var(--line);
  }
  td{padding:12px;border-bottom:1px solid var(--line);font-size:13px;}
  tr:hover{background:#fafaf7;}
  tbody tr{cursor:pointer;}

  /* ---------- Modals ---------- */
  .modal-overlay{
    display:none;position:fixed;top:0;left:0;right:0;bottom:0;
    background:rgba(0,0,0,.4);z-index:50;align-items:center;justify-content:center;
  }
  .modal-overlay.active{display:flex;}
  .modal{
    background:var(--card);border-radius:12px;padding:24px;max-height:90vh;
    overflow-y:auto;width:90%;max-width:500px;box-shadow:0 20px 60px rgba(0,0,0,.3);
  }
  .modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;}
  .modal-header h2{margin:0;font-size:18px;}
  .modal-close{
    background:none;border:none;font-size:24px;cursor:pointer;color:var(--ink-soft);
    padding:0;width:32px;height:32px;display:flex;align-items:center;justify-content:center;
  }
  .modal-close:hover{color:var(--ink);}
  .form-group{margin-bottom:16px;}
  .form-group label{display:block;font-size:12px;font-weight:600;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.6px;margin-bottom:6px;}
  .form-group input, .form-group select, .form-group textarea{
    width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;font-size:13px;
    font-family:inherit;color:var(--ink);background:var(--card);
  }
  .form-group textarea{resize:vertical;min-height:80px;}
  .modal-actions{display:flex;gap:10px;margin-top:24px;}
  .modal-actions button{flex:1;}

  /* ---------- Toast ---------- */
  .toast{
    position:fixed;bottom:20px;right:20px;background:var(--navy);color:#fff;
    padding:12px 16px;border-radius:8px;font-size:13px;z-index:60;
    box-shadow:0 4px 12px rgba(21,34,56,.25);animation:slideIn .3s ease;
  }
  @keyframes slideIn{from{transform:translateY(100%);opacity:0;} to{transform:translateY(0);opacity:1;}}

  /* ---------- Handover modal ---------- */
  .handover-section{margin-bottom:20px;}
  .handover-section h4{margin:0 0 10px;font-size:13px;font-weight:600;color:var(--ink);text-transform:uppercase;letter-spacing:.6px;}
  .handover-item{
    display:flex;gap:8px;align-items:center;padding:8px;margin-bottom:6px;
    background:#f2ede2;border-radius:6px;font-size:13px;
  }
  .handover-item input[type="checkbox"]{cursor:pointer;}
  .handover-preview{
    background:#f2ede2;border-radius:8px;padding:16px;font-size:12px;
    max-height:200px;overflow-y:auto;margin:16px 0;
  }
  .handover-preview-item{margin-bottom:8px;padding-bottom:8px;border-bottom:1px solid var(--line);}
  .handover-preview-item:last-child{border-bottom:none;}

  /* ---------- Responsive ---------- */
  @media(max-width:1200px){
    .board{grid-template-columns:repeat(3,1fr);}
    .stats{grid-template-columns:repeat(4,1fr);}
  }
  @media(max-width:768px){
    .board{grid-template-columns:repeat(2,1fr);}
    .stats{grid-template-columns:repeat(2,1fr);}
    .topbar{flex-direction:column;gap:12px;}
    .topbar-right{width:100%;justify-content:space-between;}
    table{font-size:12px;}
    td, th{padding:8px;}
    .modal{width:95%;max-width:none;}
  }
  @media(max-width:480px){
    .board{grid-template-columns:1fr;}
    .stats{grid-template-columns:1fr;}
    .toolbar{flex-direction:column;align-items:stretch;}
    .filters{flex-direction:column;width:100%;}
    .search-box{width:100%;}
    select, .btn{width:100%;}
  }

  /* ---------- Print ---------- */
  @media print{
    .topbar, .toolbar, .modal, .toast, button:not(.no-print){display:none !important;}
    body{background:#fff;padding:0;}
    .wrap{padding:0;max-width:100%;}
    .ticket, table{page-break-inside:avoid;}
  }
  .printing-ticket .board, .printing-ticket .tableView, .printing-ticket .stats{display:none;}
  .printing-handover .board, .printing-handover .tableView, .printing-handover .stats{display:none;}
</style>
</head>
<body>

<!-- top bar -->
<div class="topbar">
  <div class="brand">
    <div class="brand-mark">B</div>
    <div class="brand-text">
      <h1>Badsbrotel Suites</h1>
      <span>Hotel Ticket Desk</span>
    </div>
  </div>
  <div class="pill-row">
    <div class="status-pill"><span class="status-dot" id="netDot"></span> <span id="netLabel">Online</span></div>
    <div class="status-pill"><span class="status-dot gray" id="syncDot"></span> <span id="syncLabel">Local device only</span></div>
  </div>
  <div class="topbar-right">
    <button class="icon-btn" id="handoverBtn">📋 Handover</button>
    <button class="icon-btn" id="exportBtn">⬇ Export</button>
    <button class="icon-btn" id="importBtn">⬆ Import</button>
    <input type="file" id="importFile" accept=".json" style="display:none;">
  </div>
</div>

<div class="wrap">
  <!-- stats row -->
  <div class="stats">
    <div class="stat-card">
      <div class="stat-num" id="statTotal">0</div>
      <div class="stat-label">Total</div>
    </div>
    <div class="stat-card">
      <div class="stat-num" id="statOpen">0</div>
      <div class="stat-label">Open</div>
    </div>
    <div class="stat-card">
      <div class="stat-num" id="statInProgress">0</div>
      <div class="stat-label">In Progress</div>
    </div>
    <div class="stat-card">
      <div class="stat-num" id="statResolved">0</div>
      <div class="stat-label">Resolved</div>
    </div>
    <div class="stat-card">
      <div class="stat-num" id="statOverdue">0</div>
      <div class="stat-label">Overdue</div>
    </div>
    <div class="stat-card">
      <div class="stat-num" id="statHigh">0</div>
      <div class="stat-label">High Priority</div>
    </div>
  </div>

  <!-- toolbar -->
  <div class="toolbar">
    <div class="filters">
      <div class="search-box">
        <span>🔍</span>
        <input type="text" id="searchInput" placeholder="Search tickets...">
      </div>
      <select id="filterStatus">
        <option value="">All Status</option>
        <option value="open">Open</option>
        <option value="in-progress">In Progress</option>
        <option value="resolved">Resolved</option>
      </select>
      <select id="filterCategory">
        <option value="">All Categories</option>
        <option value="maintenance">Maintenance</option>
        <option value="housekeeping">Housekeeping</option>
        <option value="front-desk">Front Desk</option>
        <option value="concierge">Concierge</option>
        <option value="billing">Billing</option>
      </select>
      <select id="filterPriority">
        <option value="">All Priority</option>
        <option value="high">High</option>
        <option value="medium">Medium</option>
        <option value="low">Low</option>
      </select>
      <select id="filterOverdue">
        <option value="">All Due Dates</option>
        <option value="overdue">Overdue</option>
        <option value="due-today">Due Today</option>
        <option value="due-soon">Due Soon</option>
      </select>
    </div>
    <div style="display:flex;gap:10px;align-items:center;">
      <div class="view-toggle">
        <button id="viewBoardBtn" class="active">📌 Board</button>
        <button id="viewTableBtn">📊 Table</button>
      </div>
      <button class="btn btn-primary" id="newTicketBtn">+ New Ticket</button>
    </div>
  </div>

  <!-- board view -->
  <div id="boardView" class="board"></div>

  <!-- table view -->
  <div id="tableView" style="display:none;">
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Title</th>
          <th>Department</th>
          <th>Priority</th>
          <th>Status</th>
          <th>Due Date</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>

  <!-- footer -->
  <div style="margin-top:60px;padding-top:20px;border-top:1px solid var(--line);color:var(--ink-soft);font-size:12px;">
    <p id="footerNote"></p>
  </div>
</div>

<!-- New/Edit Ticket Modal -->
<div class="modal-overlay" id="ticketModalOverlay">
  <div class="modal">
    <div class="modal-header">
      <h2 id="ticketModalTitle">New Ticket</h2>
      <button class="modal-close" id="closeTicketModal">✕</button>
    </div>
    <div class="form-group">
      <label>Title</label>
      <input type="text" id="f_title" placeholder="Brief description of the issue">
    </div>
    <div class="form-group">
      <label>Description</label>
      <textarea id="f_body" placeholder="Full details..."></textarea>
    </div>
    <div class="form-group">
      <label>Department</label>
      <select id="f_category">
        <option value="maintenance">Maintenance</option>
        <option value="housekeeping">Housekeeping</option>
        <option value="front-desk">Front Desk</option>
        <option value="concierge">Concierge</option>
        <option value="billing">Billing</option>
      </select>
    </div>
    <div class="form-group">
      <label>Priority</label>
      <select id="f_priority">
        <option value="low">Low</option>
        <option value="medium" selected>Medium</option>
        <option value="high">High</option>
      </select>
    </div>
    <div class="form-group">
      <label>Due Date & Time</label>
      <input type="datetime-local" id="f_due">
    </div>
    <div class="form-group">
      <label>Status</label>
      <select id="f_status">
        <option value="open" selected>Open</option>
        <option value="in-progress">In Progress</option>
        <option value="resolved">Resolved</option>
      </select>
    </div>
    <div class="form-group">
      <label>Room Number</label>
      <input type="text" id="f_room" placeholder="e.g., 312">
    </div>
    <div class="form-group">
      <label>Guest Name</label>
      <input type="text" id="f_guest" placeholder="Optional">
    </div>
    <div class="modal-actions">
      <button class="btn" id="cancelTicketBtn">Cancel</button>
      <button class="btn btn-primary" id="saveTicketBtn">Save Ticket</button>
    </div>
  </div>
</div>

<!-- Detail Modal -->
<div class="modal-overlay" id="detailModalOverlay">
  <div class="modal">
    <div class="modal-header">
      <h2 id="detailTitle"></h2>
      <button class="modal-close" id="closeDetailModal">✕</button>
    </div>
    <div id="detailContent"></div>
    <div class="modal-actions">
      <button class="btn" id="printTicketBtn">🖨 Print</button>
      <button class="btn" id="editTicketBtn">✏ Edit</button>
      <button class="btn" id="deleteTicketBtn" style="background:#f6e3e0;color:var(--red);">🗑 Delete</button>
    </div>
  </div>
</div>

<!-- Handover Modal -->
<div class="modal-overlay" id="handoverOverlay">
  <div class="modal" style="max-width:700px;">
    <div class="modal-header">
      <h2>Shift Handover</h2>
      <button class="modal-close" id="closeHandoverModal">✕</button>
    </div>
    <div style="margin-bottom:16px;display:flex;gap:8px;">
      <button class="btn btn-primary" id="hoSelectAll" style="flex:1;">Select All</button>
      <button class="btn" id="hoSelectNone" style="flex:1;">Clear</button>
    </div>
    <div id="handoverList"></div>
    <div class="handover-preview" id="handoverPreview"></div>
    <div class="modal-actions">
      <button class="btn" id="closeHandoverBtn2">Close</button>
      <button class="btn btn-primary" id="printHandoverBtn">🖨 Print Handover</button>
    </div>
  </div>
</div>

<!-- Sync/Manual button -->
<button class="btn icon-btn" id="syncNowBtn" style="position:fixed;bottom:20px;right:20px;background:var(--brass);color:#fff;border:none;">🔄 Sync Now</button>

<script>
(function(){
  var hasSync = false; // Set to false for free hosting (no cloud storage)
  var SHARED_KEY = "badsbrotel-tickets-shared";
  var SLA_HOURS = { high:4, medium:12, low:48 };

  var state = {
    tickets:[],
    editingId:null,
    activeTicketId:null,
    view:"board",
    filters:{search:"",status:"",category:"",priority:"",overdue:""},
    handoverSelected:new Set(),
    lastSync:0
  };

  /* --------------- helpers --------------- */
  function $(id){ return document.getElementById(id); }
  function uuid(){ return Math.random().toString(36).substr(2,9); }
  function now(){ return Math.floor(Date.now()/1000); }
  function toInputDT(ms){ return new Date(ms-new Date(ms).getTimezoneOffset()*60000).toISOString().slice(0,16); }
  function fromInputDT(s){ return new Date(s).getTime()/1000; }
  function formatDT(s){
    var d = new Date(s*1000);
    return d.toLocaleDateString()+" "+d.toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"});
  }
  function showToast(msg){
    var t = document.createElement("div");
    t.className="toast";
    t.textContent=msg;
    document.body.appendChild(t);
    setTimeout(function(){ t.remove(); },3500);
  }

  /* --------------- data persistence --------------- */
  function saveLocal(){
    localStorage.setItem("badsbrotel-tickets-local", JSON.stringify(state.tickets));
    localStorage.setItem("badsbrotel-state", JSON.stringify({
      view:state.view,
      filters:state.filters
    }));
  }
  function save(){
    saveLocal();
    pushShared();
  }
  function load(){
    var tick = localStorage.getItem("badsbrotel-tickets-local");
    if(tick){
      try{ state.tickets = JSON.parse(tick); }catch(e){}
    }
    var s = localStorage.getItem("badsbrotel-state");
    if(s){
      try{
        var p = JSON.parse(s);
        state.view = p.view || "board";
        state.filters = p.filters || state.filters;
      }catch(e){}
    }
  }

  /* --------------- rendering --------------- */
  function renderAll(){
    renderStats();
    renderBoard();
    renderTable();
  }

  function renderStats(){
    var total = state.tickets.length;
    var open = state.tickets.filter(t=>t.status==="open").length;
    var inProgress = state.tickets.filter(t=>t.status==="in-progress").length;
    var resolved = state.tickets.filter(t=>t.status==="resolved").length;
    var overdue = state.tickets.filter(t=>{
      if(t.due && t.due < now()) return t.status!=="resolved";
      return false;
    }).length;
    var high = state.tickets.filter(t=>t.priority==="high").length;

    $("statTotal").textContent = total;
    $("statOpen").textContent = open;
    $("statInProgress").textContent = inProgress;
    $("statResolved").textContent = resolved;
    $("statOverdue").textContent = overdue;
    $("statHigh").textContent = high;
  }

  function applyFilters(){
    return state.tickets.filter(function(t){
      var s = state.filters.search.toLowerCase();
      if(s && !t.title.toLowerCase().includes(s) && !t.body.toLowerCase().includes(s)) return false;
      if(state.filters.status && t.status!==state.filters.status) return false;
      if(state.filters.category && t.category!==state.filters.category) return false;
      if(state.filters.priority && t.priority!==state.filters.priority) return false;
      if(state.filters.overdue){
        var od = t.due && t.due < now() && t.status!=="resolved";
        if(state.filters.overdue==="overdue" && !od) return false;
        if(state.filters.overdue==="due-today"){
          var td = t.due && t.due > now() && t.due < now()+86400;
          if(!td) return false;
        }
        if(state.filters.overdue==="due-soon"){
          var ds = t.due && t.due > now() && t.due < now()+259200;
          if(!ds) return false;
        }
      }
      return true;
    });
  }

  function renderBoard(){
    var board = $("boardView");
    board.innerHTML = "";
    var statuses = ["open", "in-progress", "resolved"];
    statuses.forEach(function(st){
      var col = document.createElement("div");
      col.className = "col";
      var head = document.createElement("div");
      head.className = "col-head";
      var h3 = document.createElement("h3");
      h3.textContent = st===("open") ? "Open" : st===("in-progress") ? "In Progress" : "Resolved";
      var count = document.createElement("div");
      count.className = "col-count";
      var tickets = applyFilters().filter(t=>t.status===st);
      count.textContent = tickets.length;
      head.appendChild(h3);
      head.appendChild(count);
      col.appendChild(head);
      var body = document.createElement("div");
      body.className = "col-body";
      if(tickets.length===0){
        var empty = document.createElement("div");
        empty.className = "empty-col";
        empty.textContent = "No tickets";
        body.appendChild(empty);
      } else {
        tickets.forEach(function(t){
          var card = renderTicketCard(t);
          body.appendChild(card);
        });
      }
      col.appendChild(body);
      board.appendChild(col);
    });
  }

  function renderTicketCard(t){
    var card = document.createElement("div");
    card.className = "ticket";
    if(t.due && t.due < now() && t.status!=="resolved") card.classList.add("overdue");
    card.setAttribute("data-id", t.id);

    var top = document.createElement("div");
    top.className = "ticket-top";
    var id = document.createElement("div");
    id.className = "ticket-id";
    id.textContent = t.id;
    var prio = document.createElement("div");
    prio.className = "prio-tag "+t.priority;
    prio.textContent = t.priority.toUpperCase();
    top.appendChild(id);
    top.appendChild(prio);
    card.appendChild(top);

    var title = document.createElement("h3");
    title.className = "ticket-title";
    title.textContent = t.title;
    card.appendChild(title);

    if(t.body){
      var body = document.createElement("p");
      body.className = "ticket-body";
      body.textContent = t.body.substring(0,100);
      card.appendChild(body);
    }

    var footer = document.createElement("div");
    footer.className = "ticket-footer";
    var dept = document.createElement("span");
    dept.className = "ticket-dept";
    dept.textContent = t.category || "—";
    var due = document.createElement("span");
    due.className = "ticket-due";
    if(t.due){
      var td = t.due;
      var dn = now();
      if(td < dn && t.status!=="resolved"){ due.classList.add("overdue"); }
      else if(td > dn && td < dn+86400){ due.classList.add("soon"); }
      due.textContent = new Date(td*1000).toLocaleDateString();
    } else {
      due.textContent = "—";
    }
    footer.appendChild(dept);
    footer.appendChild(due);
    card.appendChild(footer);

    return card;
  }

  function renderTable(){
    var rows = applyFilters();
    var tbody = $("tableBody");
    tbody.innerHTML = "";
    rows.forEach(function(t){
      var tr = document.createElement("tr");
      tr.setAttribute("data-id", t.id);
      tr.innerHTML = "<td>"+t.id+"</td><td>"+t.title+"</td><td>"+t.category+"</td><td><span class='prio-tag "+t.priority+"'>"+t.priority.toUpperCase()+"</span></td><td>"+t.status+"</td><td>"+(t.due ? new Date(t.due*1000).toLocaleDateString() : "—")+"</td>";
      tbody.appendChild(tr);
    });
  }

  /* --------------- modals --------------- */
  function openTicketModal(id){
    state.editingId = id;
    var modal = $("ticketModalOverlay");
    if(id){
      var t = state.tickets.find(x=>x.id===id);
      $("ticketModalTitle").textContent = "Edit Ticket";
      $("f_title").value = t.title;
      $("f_body").value = t.body;
      $("f_category").value = t.category;
      $("f_priority").value = t.priority;
      $("f_due").value = toInputDT(t.due*1000);
      $("f_status").value = t.status;
      $("f_room").value = t.room || "";
      $("f_guest").value = t.guest || "";
    } else {
      $("ticketModalTitle").textContent = "New Ticket";
      $("f_title").value = "";
      $("f_body").value = "";
      $("f_category").value = "maintenance";
      $("f_priority").value = "medium";
      $("f_due").value = toInputDT(Date.now() + 43200000);
      $("f_status").value = "open";
      $("f_room").value = "";
      $("f_guest").value = "";
    }
    modal.classList.add("active");
  }

  function closeTicketModal(){
    $("ticketModalOverlay").classList.remove("active");
    state.editingId = null;
  }

  function saveTicketFromForm(){
    var title = $("f_title").value.trim();
    if(!title){ showToast("Title is required."); return; }
    var id = state.editingId || uuid();
    var existing = state.tickets.findIndex(t=>t.id===id);
    var ticket = {
      id:id,
      title:title,
      body:$("f_body").value.trim(),
      category:$("f_category").value,
      priority:$("f_priority").value,
      due:fromInputDT($("f_due").value),
      status:$("f_status").value,
      room:$("f_room").value.trim(),
      guest:$("f_guest").value.trim(),
      createdAt:existing!==-1 ? state.tickets[existing].createdAt : now(),
      updatedAt:now()
    };
    if(existing!==-1){
      state.tickets[existing] = ticket;
    } else {
      state.tickets.push(ticket);
    }
    save();
    closeTicketModal();
    renderAll();
    showToast(existing!==-1 ? "Ticket updated." : "Ticket created.");
  }

  function openDetailModal(id){
    state.activeTicketId = id;
    var t = state.tickets.find(x=>x.id===id);
    if(!t) return;
    var modal = $("detailModalOverlay");
    $("detailTitle").textContent = t.title+" ("+t.id+")";
    var content = $("detailContent");
    content.innerHTML = "<p><strong>Department:</strong> "+t.category+"</p>"+
      "<p><strong>Priority:</strong> <span class='prio-tag "+t.priority+"'>"+t.priority.toUpperCase()+"</span></p>"+
      "<p><strong>Status:</strong> "+t.status+"</p>"+
      (t.room ? "<p><strong>Room:</strong> "+t.room+"</p>" : "")+
      (t.guest ? "<p><strong>Guest:</strong> "+t.guest+"</p>" : "")+
      "<p><strong>Due:</strong> "+(t.due ? formatDT(t.due) : "—")+"</p>"+
      "<p><strong>Description:</strong></p><p>"+t.body+"</p>";
    modal.classList.add("active");
  }

  function closeDetailModal(){
    $("detailModalOverlay").classList.remove("active");
    state.activeTicketId = null;
  }

  function openHandoverModal(){
    var modal = $("handoverOverlay");
    var list = $("handoverList");
    list.innerHTML = "";
    var byDept = buildHandoverSections();
    Object.keys(byDept).forEach(function(dept){
      var sec = document.createElement("div");
      sec.className = "handover-section";
      var h4 = document.createElement("h4");
      h4.textContent = dept;
      sec.appendChild(h4);
      byDept[dept].forEach(function(t){
        var item = document.createElement("div");
        item.className = "handover-item";
        var cb = document.createElement("input");
        cb.type = "checkbox";
        cb.checked = state.handoverSelected.has(t.id);
        cb.addEventListener("change", function(){
          if(this.checked) state.handoverSelected.add(t.id);
          else state.handoverSelected.delete(t.id);
          renderHandoverPreview();
        });
        var label = document.createElement("label");
        label.textContent = t.title+" ("+t.id+")";
        item.appendChild(cb);
        item.appendChild(label);
        sec.appendChild(item);
      });
      list.appendChild(sec);
    });
    renderHandoverPreview();
    modal.classList.add("active");
  }

  function closeHandoverModal(){
    $("handoverOverlay").classList.remove("active");
  }

  function buildHandoverSections(){
    var filtered = applyFilters();
    var byDept = {};
    filtered.forEach(function(t){
      if(!byDept[t.category]) byDept[t.category] = [];
      byDept[t.category].push(t);
    });
    return byDept;
  }

  function renderHandoverPreview(){
    var preview = $("handoverPreview");
    preview.innerHTML = "<strong>Handover items ("+state.handoverSelected.size+"):</strong>";
    var items = state.tickets.filter(t=>state.handoverSelected.has(t.id));
    if(items.length===0){
      preview.innerHTML += "<p style='color:var(--ink-soft);margin:12px 0 0;'>None selected.</p>";
    } else {
      var list = document.createElement("div");
      items.forEach(function(t){
        var item = document.createElement("div");
        item.className = "handover-preview-item";
        item.innerHTML = "<strong>"+t.title+" ("+t.id+")</strong><br>"+t.category+" · "+t.priority+" · "+t.status;
        list.appendChild(item);
      });
      preview.appendChild(list);
    }
  }

  function printHandover(){
    document.body.classList.add("printing-handover");
    window.print();
  }

  function exportData(){
    var url = URL.createObjectURL(new Blob([JSON.stringify(state.tickets)], {type:"application/json"}));
    var a = document.createElement("a");
    var stamp = new Date().toISOString().slice(0,10);
    a.href = url;
    a.download = "keyline-tickets-"+stamp+".json";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast("Backup file downloaded.");
  }
  function importData(file){
    var reader = new FileReader();
    reader.onload = function(){
      try{
        var data = JSON.parse(reader.result);
        if(!Array.isArray(data)) throw new Error("bad format");
        state.tickets = data;
        save();
        renderAll();
        showToast("Imported "+data.length+" tickets.");
      }catch(e){
        showToast("That file doesn't look like a Keyline backup.");
      }
    };
    reader.readAsText(file);
  }

  /* --------------- sync (disabled for free hosting) --------------- */
  function setSyncStatus(mode){
    var dot = $("syncDot"), label = $("syncLabel");
    if(!hasSync){
      dot.className = "status-dot gray";
      label.textContent = "Local device only";
      return;
    }
  }

  function pushShared(){}
  function pullShared(showFeedback){}

  /* --------------- online/offline indicator --------------- */
  function updateNetStatus(){
    var online = navigator.onLine;
    $("netDot").className = "status-dot" + (online ? "" : " off");
    $("netLabel").textContent = online ? "Online" : "Offline";
  }

  /* --------------- event wiring --------------- */
  function wire(){
    $("newTicketBtn").addEventListener("click", function(){ openTicketModal(null); });
    $("closeTicketModal").addEventListener("click", closeTicketModal);
    $("cancelTicketBtn").addEventListener("click", closeTicketModal);
    $("saveTicketBtn").addEventListener("click", saveTicketFromForm);
    $("ticketModalOverlay").addEventListener("click", function(e){ if(e.target===this) closeTicketModal(); });
    $("f_priority").addEventListener("change", function(){
      if(!state.editingId){
        $("f_due").value = toInputDT(Date.now() + SLA_HOURS[this.value]*3600000);
      }
    });

    $("closeDetailModal").addEventListener("click", closeDetailModal);
    $("detailModalOverlay").addEventListener("click", function(e){ if(e.target===this) closeDetailModal(); });
    $("editTicketBtn").addEventListener("click", function(){
      var id = state.activeTicketId;
      closeDetailModal();
      openTicketModal(id);
    });
    $("deleteTicketBtn").addEventListener("click", function(){
      var id = state.activeTicketId;
      if(confirm("Delete this ticket? This can't be undone.")){
        state.tickets = state.tickets.filter(function(t){return t.id!==id;});
        save();
        closeDetailModal();
        renderAll();
        showToast("Ticket deleted.");
      }
    });
    $("printTicketBtn").addEventListener("click", function(){
      document.body.classList.add("printing-ticket");
      window.print();
    });

    $("boardView").addEventListener("click", function(e){
      var card = e.target.closest(".ticket");
      if(card) openDetailModal(card.getAttribute("data-id"));
    });
    $("tableView").addEventListener("click", function(e){
      var row = e.target.closest("tr[data-id]");
      if(row) openDetailModal(row.getAttribute("data-id"));
    });

    $("viewBoardBtn").addEventListener("click", function(){
      state.view="board"; this.classList.add("active"); $("viewTableBtn").classList.remove("active");
      $("boardView").style.display=""; $("tableView").style.display="none"; renderAll();
    });
    $("viewTableBtn").addEventListener("click", function(){
      state.view="table"; this.classList.add("active"); $("viewBoardBtn").classList.remove("active");
      $("tableView").style.display=""; $("boardView").style.display="none"; renderAll();
    });

    $("searchInput").addEventListener("input", function(){ state.filters.search=this.value; renderAll(); });
    $("filterStatus").addEventListener("change", function(){ state.filters.status=this.value; renderAll(); });
    $("filterCategory").addEventListener("change", function(){ state.filters.category=this.value; renderAll(); });
    $("filterPriority").addEventListener("change", function(){ state.filters.priority=this.value; renderAll(); });
    $("filterOverdue").addEventListener("change", function(){ state.filters.overdue=this.value; renderAll(); });

    $("exportBtn").addEventListener("click", exportData);
    $("importBtn").addEventListener("click", function(){ $("importFile").click(); });
    $("importFile").addEventListener("change", function(){
      if(this.files && this.files[0]) importData(this.files[0]);
      this.value = "";
    });

    $("handoverBtn").addEventListener("click", openHandoverModal);
    $("closeHandoverModal").addEventListener("click", closeHandoverModal);
    $("closeHandoverBtn2").addEventListener("click", closeHandoverModal);
    $("handoverOverlay").addEventListener("click", function(e){ if(e.target===this) closeHandoverModal(); });
    $("printHandoverBtn").addEventListener("click", printHandover);
    $("hoSelectAll").addEventListener("click", function(){
      var byDept = buildHandoverSections();
      Object.keys(byDept).forEach(function(d){ byDept[d].forEach(function(t){ state.handoverSelected.add(t.id); }); });
      renderHandoverPreview();
    });
    $("hoSelectNone").addEventListener("click", function(){
      state.handoverSelected.clear();
      renderHandoverPreview();
    });

    $("syncNowBtn").addEventListener("click", function(){
      showToast("Manual sync: Export tickets and import on another device.");
    });

    window.addEventListener("online", updateNetStatus);
    window.addEventListener("offline", updateNetStatus);
    window.addEventListener("afterprint", function(){
      document.body.classList.remove("printing-handover");
      document.body.classList.remove("printing-ticket");
    });

    document.addEventListener("keydown", function(e){
      if(e.key==="Escape"){ closeTicketModal(); closeDetailModal(); closeHandoverModal(); }
    });
  }

  /* --------------- init --------------- */
  load();
  wire();
  updateNetStatus();
  setSyncStatus("local");
  renderAll();
  $("footerNote").textContent = "Badsbrotel Suites: All data stays on this device's browser. Export/Import to sync tickets between devices. Works fully offline. No data leaves your browser unless you export it.";

})();
</script>
</body>
</html>
